# Default values for app-template.
# This chart utilizes the bjw-s common library chart to generate Kubernetes resources.

# -- Workload controllers configuration
controllers:
  main:
    # -- Controller type (deployment, daemonset, statefulset)
    type: deployment
    # -- Number of desired replicas
    replicas: 1
    # -- Rollout strategy
    strategy: RollingUpdate
    containers:
      main:
        image:
          # -- Container image repository
          repository: nginx
          # -- Container image tag
          tag: 1.27.0
          # -- Container image pull policy
          pullPolicy: IfNotPresent
        # -- Resource limits and requests
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

# -- Service configuration
service:
  main:
    controller: main
    ports:
      http:
        port: 80

# -- Ingress configuration
ingress:
  main:
    # -- Enable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress host and path configurations
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            service:
              identifier: main
              port: http

# -- Persistence configuration
persistence:
  data:
    # -- Enable persistence volume
    enabled: false
    # -- Type of persistence volume
    type: emptyDir
