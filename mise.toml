[tools]
helm = "4.3.1"
helm-docs = "1.14.2"
# helm-ct = "3.15.0"
"aqua:owenlamont/ryl" = "0.25.1"
hk = "2.4.0"
oxfmt = "0.73.0"
uv = "0.13.6"
nushell = "0.116.1"
# "pipx:yamale" = "6.1.0"

[settings.pipx]
uvx = true

[tasks.fmt]
description = "Format all files using oxfmt"
run = "oxfmt ."

[tasks.fmt-check]
description = "Check file formatting using oxfmt"
run = "oxfmt --check ."

[tasks.lint]
description = "Run ryl and helm lint"
run = """
ryl check .
helm lint charts/*
"""

[tasks.check-helm-docs]
description = "Verify helm-docs are up to date and auto-fix on release PRs"
run = "nu scripts/check-helm-docs.nu"

[tasks.sync-docs]
description = "Sync chart and root README files into docs directory"
run = "nu scripts/sync-chart-docs.nu"

[tasks.docs]
description = "Generate helm docs and build site with Zensical"
depends = ["sync-docs"]
run = "nu scripts/build-docs.nu"

[tasks.serve-docs]
description = "Serve documentation locally with Zensical"
depends = ["sync-docs"]
run = "uv run zensical serve"
